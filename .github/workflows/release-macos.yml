# Windows/macOS 发布工作流：手动触发，分发 Windows 便携 ZIP 和 macOS DMG。
#
# 签名与公证（可选，全部缺省时使用 ad hoc 签名，仅供测试）：
#   MACOS_CERTIFICATE_P12        Developer ID Application 证书（.p12）的 base64
#   MACOS_CERTIFICATE_PASSWORD   .p12 导出密码
#   APPLE_ID                     公证用 Apple ID
#   APPLE_APP_SPECIFIC_PASSWORD  App 专用密码
#   APPLE_TEAM_ID                开发者团队 ID
# Windows 自签名（必填，固定证书跨版本复用）：
#   WINDOWS_CERTIFICATE_PFX      含私钥的 .pfx 的 base64
#   WINDOWS_CERTIFICATE_PASSWORD .pfx 导出密码
name: Release Windows and macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: '打包版本号（缺省取 Directory.Build.props）'
        required: false
        type: string
      publish:
        description: '创建 GitHub Release'
        required: false
        type: boolean
        default: true
      skip_tests:
        description: '忽略测试（直接构建发布）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare:
    name: Determine release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Determine version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          version = os.environ["VERSION_INPUT"].strip() or ET.parse("Directory.Build.props").findtext(".//Version")
          if os.environ.get("GITHUB_REF", "").startswith("refs/tags/"):
              version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if not version or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", version):
              raise SystemExit("Version must be major.minor.patch with an optional prerelease suffix.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

  test:
    name: Test
    if: github.event.inputs.skip_tests != 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Install native dependencies
        run: brew install sdl3 harfbuzz
      - name: Run .NET tests
        run: dotnet test BubuZip.slnx
      - name: Run packaging tests
        run: python3 eng/test_package_macos.py
      - name: Run Finder extension tests
        run: eng/macos-finder-extension/test.sh

  build:
    name: Build macOS (${{ matrix.arch }})
    needs: [prepare, test]
    # Test 被跳过会连带跳过依赖它的作业，必须用 always() 状态函数越过该传播；
    # 结果检查保证测试失败或取消时仍然不构建。
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
            arch: arm64
          - runner: macos-15-intel
            rid: osx-x64
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Install native dependencies
        run: brew install sdl3 harfbuzz

      - name: Verify native library packaging
        run: python3 eng/test_macos_bundle.py

      - name: Set application version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # 程序集版本与包版本保持一致。
          sed -i '' "s|<Version>.*</Version>|<Version>$VERSION</Version>|" Directory.Build.props

      - name: Configure code signing and notarization
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            echo "未配置 Developer ID 证书，使用 ad hoc 签名。"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/bubuzip-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o 'Developer ID Application: [^"]*' | head -n 1 || true)"
          if [[ -z "$identity" ]]; then
            echo "导入的证书中没有 Developer ID Application 身份。" >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          notarize=false
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            xcrun notarytool store-credentials "bubuzip-notary" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
            notarize=true
          else
            echo "公证凭据不完整，跳过公证（应用仍使用 Developer ID 签名）。"
          fi
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"

      - name: Package NativeAOT BubuZip.app
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
        run: |
          args=(--rid "$RID" --version "$VERSION" --force)
          if [[ "$SIGN_IDENTITY" != "-" ]]; then
            args+=(--sign-identity "$SIGN_IDENTITY")
            if [[ "$NOTARIZE" == "true" ]]; then
              args+=(--notary-profile bubuzip-notary)
            fi
          fi
          ./eng/package-macos.sh "${args[@]}"

      - name: Smoke test NativeAOT executable
        run: |
          out/macos/BubuZip.app/Contents/MacOS/BubuZip --help
          out/macos/BubuZip.app/Contents/MacOS/BubuZip --shot "$RUNNER_TEMP/bubuzip-nativeaot.png"

      - name: Verify Gatekeeper assessment
        if: steps.signing.outputs.notarize == 'true'
        run: spctl --assess --type execute --verbose=2 out/macos/BubuZip.app

      - name: Create and verify DMG
        id: dmg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          RID: ${{ matrix.rid }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
        run: |
          mkdir -p dist
          dmg="$PWD/dist/BubuZip-$VERSION-macos-$ARCH.dmg"
          staging="$(mktemp -d "$RUNNER_TEMP/bubuzip-dmg.XXXXXX")"
          mount_point="$(mktemp -d "$RUNNER_TEMP/bubuzip-mount.XXXXXX")"
          mounted=false
          cleanup() {
            if [[ "$mounted" == "true" ]]; then
              hdiutil detach "$mount_point" || true
            fi
            rm -rf "$staging"
            rmdir "$mount_point" || true
          }
          trap cleanup EXIT
          # ditto 保留已签名应用的权限、扩展属性和符号链接。
          ditto out/macos/BubuZip.app "$staging/BubuZip.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname BubuZip -srcfolder "$staging" -fs HFS+ -format UDRO "$dmg"
          if [[ "$SIGN_IDENTITY" != "-" ]]; then
            codesign --force --sign "$SIGN_IDENTITY" --timestamp "$dmg"
          fi
          if [[ "$NOTARIZE" == "true" ]]; then
            xcrun notarytool submit "$dmg" --keychain-profile bubuzip-notary --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          fi
          hdiutil verify "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point"
          mounted=true
          python3 eng/package-macos.py --verify "$mount_point/BubuZip.app" --rid "$RID"
          hdiutil detach "$mount_point"
          mounted=false
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.dmg.outputs.path }}
          # v7 可原样上传单个文件；产物名直接使用 DMG 文件名。
          archive: false
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: [prepare, test]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Set application version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $path = Join-Path $PWD 'Directory.Build.props'
          $content = [IO.File]::ReadAllText($path)
          $content = $content -replace '<Version>.*?</Version>', "<Version>$env:VERSION</Version>"
          [IO.File]::WriteAllText($path, $content)
      - name: Import Windows signing certificate
        id: windows-signing
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE_PFX -or !$env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Configure WINDOWS_CERTIFICATE_PFX and WINDOWS_CERTIFICATE_PASSWORD. See docs/windows-signing.md.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'bubuzip-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $certificates.Thumbprint | Set-Content (Join-Path $env:RUNNER_TEMP 'bubuzip-signing-thumbprints.txt')
            $signers = @($certificates | Where-Object HasPrivateKey)
            if ($signers.Count -ne 1) { throw 'Expected exactly one signing certificate with a private key.' }
            $cert = $signers[0]
            "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
            "subject=$($cert.Subject)" >> $env:GITHUB_OUTPUT
            Write-Host "Signing certificate: $($cert.Subject), $($cert.Thumbprint)"
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
      - name: Package Windows NativeAOT application and shell extension
        env:
          ARCH: ${{ matrix.arch }}
          CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
          CERTIFICATE_SUBJECT: ${{ steps.windows-signing.outputs.subject }}
        run: |
          ./eng/package-windows.ps1 -Architecture $env:ARCH `
            -Publisher $env:CERTIFICATE_SUBJECT -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT
      - name: Smoke test NativeAOT executable
        if: matrix.arch == 'x64'
        run: |
          $exe = Join-Path $PWD 'out/windows-x64/BubuZip.exe'
          $preview = Join-Path $env:RUNNER_TEMP 'bubuzip-nativeaot.png'
          $process = Start-Process -FilePath $exe -ArgumentList "--shot `"$preview`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $preview)) {
            throw 'NativeAOT UI smoke test failed.'
          }
      - name: Create and verify portable ZIP
        id: zip
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $output = Join-Path $PWD "out/windows-$env:ARCH"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = Join-Path $PWD "dist/BubuZip-$env:VERSION-windows-$env:ARCH.zip"
          ./eng/verify-windows-nativeaot.ps1 -OutputDirectory $output -Architecture $env:ARCH
          $required = @('BubuZip.exe', 'BubuZip.Archive.ico', 'BubuZipShell.dll',
                        'BubuZip.ContextMenu.msix', 'resources.pri', 'libHarfBuzzSharp.dll',
                        'vello_ffi.dll', 'vello_sparse_ffi.dll', 'Assets/StoreLogo.png',
                        'BubuZip.Signing.cer', 'Windows-Certificate.txt', 'Windows-Certificate-Fingerprint.txt',
                        'Assets/Square44x44Logo.png', 'Assets/Square150x150Logo.png',
                        'Assets/Square44x44Logo.targetsize-32_altform-unplated.png',
                        'Assets/Square44x44Logo.targetsize-32_altform-lightunplated.png')
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath (Join-Path $output $file) -PathType Leaf)) {
              throw "Missing Windows package file: $file"
            }
          }
          # ZipFile includes the entire publish directory, including hidden files.
          [IO.Compression.ZipFile]::CreateFromDirectory($output, $zip)
          & 7z t $zip
          if ($LASTEXITCODE) { throw 'Windows ZIP integrity check failed.' }
          "path=$zip" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.zip.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Remove Windows signing certificate
        if: always()
        run: |
          $list = Join-Path $env:RUNNER_TEMP 'bubuzip-signing-thumbprints.txt'
          if (Test-Path -LiteralPath $list) {
            foreach ($thumbprint in Get-Content -LiteralPath $list) {
              $path = "Cert:\CurrentUser\My\$thumbprint"
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -DeleteKey -Force }
            }
            Remove-Item -LiteralPath $list -Force
          }

  release:
    name: GitHub release
    needs: [prepare, build, build-windows]
    # Test 的跳过状态也会沿依赖链影响 Release；只在构建成功且未取消时发布。
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.build-windows.result == 'success' && github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: BubuZip-*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Generate checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sha256sum "BubuZip-$VERSION-macos-arm64.dmg" "BubuZip-$VERSION-macos-x64.dmg" \
            "BubuZip-$VERSION-windows-x64.zip" "BubuZip-$VERSION-windows-arm64.zip" > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt --clobber
            # 同版本重新发布时更新旧链接并补齐 Windows 下载，保留已有发布说明。
            gh release view "$tag" --json body --jq '.body' > "$notes"
            python3 - "$notes" <<'PY'
          import os
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          body = path.read_text(encoding="utf-8")
          for arch in ("arm64", "x64"):
              name = f"BubuZip-{os.environ['VERSION']}-macos-{arch}"
              body = body.replace(name + ".zip", name + ".dmg")
          windows_notes = []
          for arch in ("x64", "arm64"):
              name = f"BubuZip-{os.environ['VERSION']}-windows-{arch}.zip"
              url = f"https://github.com/{os.environ['GH_REPO']}/releases/download/v{os.environ['VERSION']}/{name}"
              if url not in body:
                  windows_notes.append(f"- [{name}]({url})")
          if windows_notes:
              body += "\n\n## Windows 下载\n\n" + "\n".join(windows_notes)
          signing_note = "Windows 使用自签证书；完整解压 ZIP 后运行 BubuZip.exe。注册 Windows 11 一级右键菜单前，请按包内 Windows-Certificate.txt 手动信任 BubuZip.Signing.cer。自签不保证消除 SmartScreen 提示。"
          body = body.replace("当前 Windows 包未签名，Windows 11 一级右键菜单需另行使用受信任证书签名后注册。", "")
          if signing_note not in body:
              body += "\n\n" + signing_note + "\n"
          path.write_text(body, encoding="utf-8")
          PY
            gh release edit "$tag" --notes-file "$notes"
          else
            # 正文列出下载链接，Release 底部 Assets 区也会自动展示全部附件。
            {
              printf '## 下载\n\n'
              for file in dist/*.dmg dist/*.zip; do
                name="$(basename "$file")"
                printf -- '- [%s](https://github.com/%s/releases/download/%s/%s)\n' "$name" "$GH_REPO" "$tag" "$name"
              done
              printf '\n打开 DMG 后，将 BubuZip.app 拖到 Applications（应用程序）即可安装。\n'
              printf '\nWindows 使用自签证书；完整解压 ZIP 后运行 BubuZip.exe。注册 Windows 11 一级右键菜单前，请按包内 Windows-Certificate.txt 手动信任 BubuZip.Signing.cer。自签不保证消除 SmartScreen 提示。\n'
              printf '\n校验和见 `SHA256SUMS.txt`。\n'
            } > "$notes"
            gh release create "$tag" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt --title "BubuZip $tag" \
              --generate-notes --notes-file "$notes" --target "$GITHUB_SHA"
          fi
